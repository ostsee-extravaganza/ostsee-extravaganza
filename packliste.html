<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Packliste — Ostsee Extravaganza</title>
<meta name="description" content="Shared packing list, sized against what early September on the Baltic actually does, with the car-rental documents built in.">
<meta name="theme-color" content="#10344c">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/img/motifs/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/oswald-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/worksans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

<main id="main">
  <header class="page-head">
    <div class="wrap page-head__inner">
      <p class="eyebrow">Packliste</p>
      <h1>Was mit muss</h1>
      <p class="lede" id="lede"></p>
      <dl class="page-head__facts" id="head-facts"></dl>
    </div>
  </header>

  <div class="wave-band wave-band--from-navy"></div>

  <section class="section section--tight">
    <div class="wrap">
      <div class="map-toolbar">
        <div class="cluster" id="who-tabs" role="group" aria-label="Nach Person filtern"></div>
        <div class="cluster" style="margin-left:auto">
          <button class="btn btn--sm btn--ghost" id="btn-hide-done" type="button" aria-pressed="false">
            Erledigte ausblenden</button>
          <button class="btn btn--sm btn--ghost" id="btn-reset" type="button">Alles zurücksetzen</button>
        </div>
      </div>

      <div class="progress mt-5" id="progress"></div>
      <div id="groups" class="mt-6"></div>
    </div>
  </section>

  <section class="section section--alt">
    <div class="wrap wrap--narrow">
      <div class="notice notice--info">
        <div class="notice__title">Wo die Haken liegen</div>
        <p>In diesem Browser, sonst nirgends — jeder sieht nur die eigenen. Die Liste selbst steht in
          <code>data/packliste.json</code>; wer etwas ergänzen will, das beide betrifft, ergänzt sie dort.</p>
      </div>
    </div>
  </section>
</main>

<script type="module" src="assets/js/packliste.js"></script>
</body>
</html>
