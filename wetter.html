<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wetter &amp; Wasser — Ostsee Extravaganza</title>
<meta name="description" content="Live forecast, Baltic sea temperature, wind and sun times for Rostock, Zingst, Binz and Stralsund.">
<meta name="theme-color" content="#10344c">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/img/motifs/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/oswald-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/worksans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/site.css">

<link rel="canonical" href="https://ostsee-extravaganza.github.io/ostsee-extravaganza/wetter.html">
<meta property="og:site_name" content="Ostsee Extravaganza">
<meta property="og:type" content="website">
<meta property="og:locale" content="de_DE">
<meta property="og:url" content="https://ostsee-extravaganza.github.io/ostsee-extravaganza/wetter.html">
<meta property="og:title" content="Wetter &amp; Wasser — Ostsee Extravaganza">
<meta property="og:description" content="Live forecast, Baltic sea temperature, wind and sun times for Rostock, Zingst, Binz and Stralsund.">
<meta property="og:image" content="https://ostsee-extravaganza.github.io/ostsee-extravaganza/assets/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Seebrücke Sellin auf Rügen zur blauen Stunde, darüber der Schriftzug Ostsee Extravaganza.">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>

<main id="main">
  <header class="page-head">
    <div class="wrap page-head__inner">
      <p class="eyebrow">Wetter &amp; Wasser</p>
      <h1>Was oben und was unten los ist</h1>
      <p class="lede">Live forecast, Baltic water temperature, wind and sun times for all four
        towns. Free, no API key, and nothing about you leaves this page.</p>
      <dl class="page-head__facts" id="head-facts"></dl>
    </div>
  </header>

  <div class="wave-band wave-band--from-navy"></div>

  <!-- current -->
  <section class="section section--tight">
    <div class="wrap">
      <div class="cluster" style="justify-content:space-between">
        <div>
          <p class="eyebrow">Jetzt</p>
          <h2>Vier Orte, gerade eben</h2>
        </div>
        <button class="btn btn--sm btn--ghost" id="btn-refresh" type="button">Aktualisieren</button>
      </div>
      <div class="grid grid--4 mt-5" id="now"></div>
      <p class="xs faint mt-4" id="now-note"></p>
    </div>
  </section>

  <!-- forecast -->
  <section class="section section--alt">
    <div class="wrap">
      <div class="section-head">
        <p class="eyebrow">Vorhersage</p>
        <h2>Die nächsten Tage</h2>
        <p class="lede" id="fc-note"></p>
      </div>
      <div class="cluster" id="town-tabs" role="tablist" aria-label="Ort wählen"></div>
      <div class="table-scroll mt-4" id="forecast"></div>
    </div>
  </section>

  <div class="wave-band wave-band--from-alt"></div>

  <!-- climate normals -->
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <p class="eyebrow">Normalerweise</p>
        <h2>Anfang September an der Ostsee</h2>
        <p class="lede" id="klima-note"></p>
      </div>
      <div class="table-scroll" id="klima"></div>
      <p class="xs faint mt-4" id="klima-src"></p>
    </div>
  </section>
</main>

<script type="module" src="assets/js/wetter.js"></script>
</body>
</html>
